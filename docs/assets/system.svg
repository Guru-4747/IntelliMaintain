<text x="40" y="68" font-size="13.5" fill="#93a4c3" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">Bounded agent: at most 6 calls to 4 approved tools, then a grounded answer that is checked sentence by sentence</text>
